name: Build DOOM CoMaps iOS binaries

on:
  workflow_dispatch:
    inputs:
      doom_ref:
        description: ram-labz/doom branch or SHA with the native patch scripts
        default: chat2
        required: true

permissions:
  contents: read

concurrency:
  group: doom-comaps-native-builder
  cancel-in-progress: false

jobs:
  build:
    name: Compile patched CoMaps and DuckDB
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - name: Check private repository access
        env:
          ACCESS_TOKEN: ${{ secrets.DOOM_REPO_READ_TOKEN }}
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo '::error::Missing DOOM_REPO_READ_TOKEN repository secret.'
            exit 1
          fi

      - name: Check out DOOM native build scripts
        uses: actions/checkout@v4
        with:
          repository: ram-labz/doom
          ref: ${{ inputs.doom_ref || 'chat2' }}
          token: ${{ secrets.DOOM_REPO_READ_TOKEN }}
          persist-credentials: false
          path: doom

      # Fail before Flutter installation or the costly CoMaps bootstrap if
      # a stale DOOM branch lacks the actual outgoing-street resolver.
      - name: Verify native street-name source and preflight contracts
        working-directory: doom
        run: |
          python3 - <<'PY'
          from pathlib import Path
          patch = Path('tool/patch_embedded_turns.dart').read_text()
          prepare = Path('tool/prepare_embedded_navigation.sh').read_text()
          guidance = Path('lib/core/doom_turn_guidance.dart').read_text()
          required = (
              'GetClosestStreetNameAfterIdx(turn.m_index, nextInfo)',
              'nextInfo.m_ref',
              'nextInfo.m_destination_ref',
              'doom_comaps_route_turns',
          )
          for token in required:
              if token not in patch:
                  raise SystemExit(f'Native street-name patch missing: {token}')
          if 'patch_embedded_turns.dart' not in prepare:
              raise SystemExit('Native build does not apply turns patch.')
          if 'upcomingInstruction' not in guidance:
              raise SystemExit('Turn guidance formatter missing.')
          print('Native street-name and map-turn source gates passed.')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify build environment
        run: |
          xcodebuild -version
          cmake --version
          git lfs version
          flutter --version

      - name: Prepare Flutter project
        working-directory: doom
        run: |
          flutter create --platforms=ios --project-name doom --org com.ramlabz .
          flutter pub get

      - name: Build native CoMaps and DuckDB once
        working-directory: doom
        env:
          DOOM_IOS_DEVICE_ONLY: '1'
        run: bash tool/prepare_embedded_navigation.sh ios

      - name: Inspect compiled framework paths
        if: always()
        working-directory: doom
        run: |
          echo "Compiled iOS framework paths:"
          ls -ld .native_build/agus_maps_flutter/ios/Frameworks || true
          ls -ld .native_build/agus_maps_flutter/ios/agus_maps_flutter/Frameworks || true
          ls -lh .native_build/agus_maps_flutter/ios/Frameworks/*.xcframework/Info.plist || true
          echo "Available disk space:"
          df -h .

      # If anything fails after native compilation, preserve the expensive
      # output rather than discarding it when the ephemeral runner exits.
      - name: Rescue compiled frameworks after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doom-ios-native-rescue
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0
          include-hidden-files: true
          path: |
            doom/.native_build/agus_maps_flutter/ios/Frameworks
            doom/.native_build/agus_maps_flutter/ios/agus_maps_flutter/Package.swift
            doom/assets/comaps_data
            doom/assets/maps

      - name: Package verified binaries and matching map assets
        working-directory: doom
        run: |
          bash tool/package_ios_native_bundle.sh "$RUNNER_TEMP/doom-ios-native.tar.gz"
          shasum -a 256 "$RUNNER_TEMP/doom-ios-native.tar.gz" | tee "$RUNNER_TEMP/doom-ios-native.sha256"

      - name: Upload reusable native bundle
        uses: actions/upload-artifact@v4
        with:
          name: doom-ios-native-bundle
          path: |
            ${{ runner.temp }}/doom-ios-native.tar.gz
            ${{ runner.temp }}/doom-ios-native.sha256
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
