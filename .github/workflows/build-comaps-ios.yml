name: Build DOOM CoMaps iOS binaries

on:
  workflow_dispatch:
    inputs:
      doom_ref:
        description: ram-labz/doom branch or SHA with the native patch scripts
        default: chat4
        required: true

permissions:
  contents: read

concurrency:
  group: doom-comaps-native-builder
  cancel-in-progress: false

jobs:
  build:
    name: Compile patched CoMaps and DuckDB
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - name: Check private repository access
        env:
          ACCESS_TOKEN: ${{ secrets.DOOM_REPO_READ_TOKEN }}
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo '::error::Missing DOOM_REPO_READ_TOKEN repository secret.'
            exit 1
          fi

      - name: Check out DOOM native build scripts
        uses: actions/checkout@v4
        with:
          repository: ram-labz/doom
          ref: ${{ inputs.doom_ref || 'chat4' }}
          token: ${{ secrets.DOOM_REPO_READ_TOKEN }}
          persist-credentials: false
          path: doom

      # Fail before Flutter installation or the costly CoMaps bootstrap if
      # a stale DOOM branch lacks the actual outgoing-street resolver.
      - name: Verify native street-name source and preflight contracts
        working-directory: doom
        run: |
          python3 - <<'PY'
          from pathlib import Path
          patch = Path('tool/patch_embedded_turns.dart').read_text()
          prepare = Path('tool/prepare_embedded_navigation.sh').read_text()
          guidance = Path('lib/core/doom_turn_guidance.dart').read_text()
          required = (
              'GetClosestStreetNameAfterIdx(turn.m_index, nextInfo)',
              'nextInfo.m_ref',
              'nextInfo.m_destination_ref',
              'doom_comaps_route_turns',
          )
          for token in required:
              if token not in patch:
                  raise SystemExit(f'Native street-name patch missing: {token}')
          if 'patch_embedded_turns.dart' not in prepare:
              raise SystemExit('Native build does not apply turns patch.')
          camera = Path('tool/patch_embedded_route_camera.py').read_text()
          if ('DOOM_ROUTE_PREVIEW_CAMERA_OWNED_BY_FLUTTER' not in camera or
                  'SetModelViewRect' not in camera):
              raise SystemExit('Native route-camera suppression patch missing.')
          if ('DOOM_MODE_SWITCH_CAMERA_BUILD_GATE' not in prepare or
                  'patch_embedded_route_camera.py' not in prepare):
              raise SystemExit('Native builder must apply camera patch before compile.')
          if 'upcomingInstruction' not in guidance:
              raise SystemExit('Turn guidance formatter missing.')
          marker = Path('tool/patch_embedded_navigation_marker.py').read_text()
          if ('DOOM_HIDE_DUPLICATE_NATIVE_LOCATION_MARKER' not in marker or
                  'DOOM_HIDE_EXTRA_ROUTE_MANEUVER_ARROWS' not in marker or
                  'ROUTE_RELATIVE_SOURCE' not in marker or
                  'patch_route_renderer' not in marker):
              raise SystemExit('Native GPS dot or duplicate turn-arrow patch missing.')
          if 'patch_checkout(pathlib.Path(argv[1]))' not in camera:
              raise SystemExit('Native builder does not apply the visual marker patch.')
          print('Native GPS, arrow, route camera and street-name gates passed.')
          PY
          python3 -m unittest discover -s test -p 'test_embedded_navigation_marker_patch.py' -v
          python3 -m unittest discover -s test -p 'test_doom_map_features_patch.py' -v
          python3 -m unittest discover -s test -p 'test_embedded_ios_frame_pacing_patch.py' -v
          python3 -m unittest discover -s test -p 'test_map_mode_camera_and_ci_cache.py' -v
          python3 -m py_compile tool/patch_embedded_navigation_marker.py \
            tool/patch_embedded_route_camera.py \
            tool/patch_embedded_doom_map_features.py \
            tool/patch_embedded_ios_frame_pacing.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify build environment
        run: |
          xcodebuild -version
          cmake --version
          git lfs version
          flutter --version

      - name: Prepare Flutter project
        working-directory: doom
        run: |
          flutter create --platforms=ios --project-name doom --org com.ramlabz .
          flutter pub get

      - name: Build native CoMaps and DuckDB once
        working-directory: doom
        env:
          DOOM_IOS_DEVICE_ONLY: '1'
        run: bash tool/prepare_embedded_navigation.sh ios

      - name: Confirm compiled bundle source contains all visual fixes
        working-directory: doom
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('tool').resolve()))
          from patch_embedded_navigation_marker import (
              MARKER, ROUTE_MARKER, RELATIVE_SOURCE, ROUTE_RELATIVE_SOURCE,
              patch_source, patch_route_renderer,
          )
          comaps = Path('.native_build/agus_maps_flutter/thirdparty/comaps')
          position = (comaps / RELATIVE_SOURCE).read_text(encoding='utf-8')
          route = (comaps / ROUTE_RELATIVE_SOURCE).read_text(encoding='utf-8')
          if MARKER not in position or ROUTE_MARKER not in route:
              raise SystemExit('Missing CoMaps GPS or route visual patch in compiled source')
          if patch_source(position) != position or patch_route_renderer(route) != route:
              raise SystemExit('CoMaps compiled source has incomplete visual patch')
          bridge = Path('.native_build/agus_maps_flutter/ios/agus_maps_flutter/Sources/'
                        'agus_maps_flutter_native/agus_maps_flutter_ios.mm').read_text()
          for feature in (
              'doom_comaps_search_viewport', 'doom_comaps_reverse_geocode',
              'doom_comaps_set_marks_selected', 'm_removedIds.insert(id)',
              '!mf::g_marksInitialized', 'doom_comaps_route_turns',
          ):
              if feature not in bridge:
                  raise SystemExit(f'Missing native engine feature: {feature}')
          print('PASS: native source has removed blue markers and ghost-pin cleanup')
          PY

      - name: Inspect compiled framework paths
        if: always()
        working-directory: doom
        run: |
          echo "Compiled iOS framework paths:"
          ls -ld .native_build/agus_maps_flutter/ios/Frameworks || true
          ls -ld .native_build/agus_maps_flutter/ios/agus_maps_flutter/Frameworks || true
          ls -lh .native_build/agus_maps_flutter/ios/Frameworks/*.xcframework/Info.plist || true
          echo "Available disk space:"
          df -h .

      # If anything fails after native compilation, preserve the expensive
      # output rather than discarding it when the ephemeral runner exits.
      - name: Rescue compiled frameworks after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doom-ios-native-rescue
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0
          include-hidden-files: true
          path: |
            doom/.native_build/agus_maps_flutter/ios/Frameworks
            doom/.native_build/agus_maps_flutter/ios/agus_maps_flutter/Package.swift
            doom/assets/comaps_data
            doom/assets/maps

      - name: Package verified binaries and matching map assets
        working-directory: doom
        run: |
          bash tool/package_ios_native_bundle.sh "$RUNNER_TEMP/doom-ios-native.tar.gz"
          shasum -a 256 "$RUNNER_TEMP/doom-ios-native.tar.gz" | tee "$RUNNER_TEMP/doom-ios-native.sha256"

      - name: Upload reusable native bundle
        uses: actions/upload-artifact@v4
        with:
          name: doom-ios-native-bundle
          path: |
            ${{ runner.temp }}/doom-ios-native.tar.gz
            ${{ runner.temp }}/doom-ios-native.sha256
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
