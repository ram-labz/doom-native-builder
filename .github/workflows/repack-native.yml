name: Slim successful CoMaps artifact (no compilation)

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: doom-ios-native-bundle artifact id from a successful build run
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: doom-comaps-repack
  cancel-in-progress: false

jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Confirm source artifact is a successful native compile
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_ARTIFACT_ID" =~ ^[0-9]{5,15}$ ]] || { echo 'Invalid artifact id'; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$SOURCE_ARTIFACT_ID" \
            --jq 'if .name == "doom-ios-native-bundle" and .expired == false
                     and .size_in_bytes > 0 and .workflow_run.id != null
                  then {name,expired,size_in_bytes,workflow_run}
                  else error("Artifact is empty, expired, or wrong type") end'
          RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$SOURCE_ARTIFACT_ID" --jq '.workflow_run.id')
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID" \
            --jq 'if .name == "Build DOOM CoMaps iOS binaries"
                     and .status == "completed" and .conclusion == "success"
                  then {id,status,conclusion,name,head_sha}
                  else error("Source CoMaps compile is not successful") end'
          df -h /
      - name: Repack existing native archive without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ runner.temp }}/doom-ios-native-slim.tar.gz
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: python3 scripts/repack_existing_artifact.py
      - name: Upload compact verified archive
        uses: actions/upload-artifact@v4
        with:
          name: doom-ios-native-slim
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
          path: |
            ${{ runner.temp }}/doom-ios-native-slim.tar.gz
            ${{ runner.temp }}/doom-ios-native-slim.tar.gz.sha256
