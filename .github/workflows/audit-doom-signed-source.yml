name: DOOM free signed-build source audit (no compilation)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-doom-signed-source.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doom-source-audit-free
  cancel-in-progress: false

jobs:
  audit:
    name: Check DOOM source without Flutter or CoMaps compilation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify existing private DOOM checkout permission
        env:
          DOOM_READ_TOKEN: ${{ secrets.DOOM_REPO_READ_TOKEN }}
        run: |
          test -n "$DOOM_READ_TOKEN" || {
            echo '::error::Existing DOOM_REPO_READ_TOKEN is missing.'
            exit 1
          }

      - name: Checkout signed iOS branch source
        uses: actions/checkout@v4
        with:
          repository: ram-labz/doom
          ref: feature/embedded-offline-navigation
          token: ${{ secrets.DOOM_REPO_READ_TOKEN }}
          persist-credentials: false
          path: doom

      - name: Fail-fast Python syntax check
        working-directory: doom
        run: python3 -m compileall -q tool test

      - name: Verify shell syntax before any native build
        working-directory: doom
        run: bash -n tool/prepare_embedded_navigation.sh tool/package_ios_native_bundle.sh tool/build_embedded_navigation.sh

      - name: Run complete signed-build Python regression suite
        working-directory: doom
        run: python3 -m unittest discover -s test -p 'test_*.py' -v

      - name: Verify CoMaps prebuilt-only and signed workflow ordering
        working-directory: doom
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path("codemagic.yaml").read_text().split("  ios_signed_ipa:", 1)[1]
          gates = [
              "python3 tool/restore_ios_native_bundle.py --check",
              "python3 -m unittest discover",
              "python3 tool/check_export_compliance.py",
              "flutter create --platforms=ios",
              "flutter pub get",
              "dart run tool/configure_platforms.dart",
              "python3 tool/configure_firebase.py --platform ios",
              "flutter analyze --no-fatal-infos --no-fatal-warnings",
              "flutter test --reporter expanded",
              "\n        script: python3 tool/restore_ios_native_bundle.py\n",
              "python3 tool/retain_ios_ffi_exports.py .native_build/agus_maps_flutter",
              "python3 tool/verify_ios_native_frameworks.py",
              "dart run tool/release_preflight.dart",
              "xcode-project detect-bundle-id",
              "xcode-project use-profiles",
              "flutter build ipa --release",
              "python3 tool/verify_ios_ipa_native_gps.py",
          ]
          missing = [g for g in gates if g not in s]
          assert not missing, f"Missing signed IPA stage(s): {missing}"
          assert [s.index(x) for x in gates] == sorted(s.index(x) for x in gates), (
              "Signed workflow stages out of expected order"
          )
          assert "prepare_embedded_navigation.sh" not in s
          assert "bash tool/build_embedded_navigation.sh" not in s
          assert "DOOM_IOS_NATIVE_BUNDLE_MANIFEST_URL:" in s
          assert "DOOM_IOS_NATIVE_BUNDLE_SHA256:" in s
          # Apple's build number, not Codemagic's per-workflow counter, must
          # drive both the signed IPA and its ShareExtension.
          reserve = "python3 tool/resolve_ios_build_number.py"
          flutter_build = 'flutter build ipa --release --build-number="$DOOM_IOS_BUILD_NUMBER"'
          final_gate = "python3 tool/verify_ios_bundle_versions.py"
          assert reserve in s and flutter_build in s and final_gate in s
          assert s.index(reserve) < s.index("flutter create --platforms=ios")
          assert s.index(reserve) < s.index("dart run tool/configure_platforms.dart")
          assert s.index(flutter_build) < s.index(final_gate)
          assert '--build-number="$BUILD_NUMBER"' not in s
          assert "ENV['DOOM_IOS_BUILD_NUMBER']" in (
              Path("tool/install_share_extension.rb").read_text()
          )
          # Codemagic CLI defaults to recursively scanning **/*.xcodeproj,
          # including broken example projects under build/ios/SourcePackages.
          # Scope BOTH commands to the generated DOOM Runner project.
          assert "xcode-project detect-bundle-id --project ios/Runner.xcodeproj --target Runner" in s
          assert "script: xcode-project use-profiles --project ios/Runner.xcodeproj" in s
          assert s.count("xcode-project detect-bundle-id") == 1
          assert s.count("xcode-project use-profiles") == 1
          assert "from download_ios_native_release import read_verified_manifest" in (
              Path("tool/restore_ios_native_bundle.py").read_text()
          )
          assert "DynamicLibrary.process()" in (
              Path("tool/retain_ios_ffi_exports.py").read_text()
          )
          assert "--ffi-source .native_build/agus_maps_flutter/" in s
          assert "python3 tool/verify_ios_ipa_native_gps.py" in s
          print("PASS: signed IPA uses pinned precompiled native binaries and ordered gates.")
          PY

      - name: Verify published Hawaii .tar size and SHA-256 match the app catalog
        working-directory: doom
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          catalog = json.loads(Path("assets/catalog_seed.json").read_text())
          regions = {x["id"]: x for x in catalog["regions"]}
          hawaii = regions["hawaii"]
          uri = "https://api.github.com/repos/ram-labz/doom-native-builder/releases/tags/doom-road-hawaii-run-41744558244"
          with urllib.request.urlopen(urllib.request.Request(
              uri, headers={"User-Agent": "doom-source-audit"}), timeout=30) as response:
              release = json.load(response)
          assets = {a["name"]: a for a in release["assets"]}
          asset = assets["valhalla_tiles_hawaii.tar"]
          assert not release["draft"] and asset["state"] == "uploaded"
          assert hawaii["sizeBytes"] == asset["size"]
          assert asset["digest"] == "sha256:" + hawaii["sha256"]
          assert asset["browser_download_url"] == hawaii["url"]
          assert "OpenStreetMap" in hawaii["attribution"]
          print("PASS: Hawaii routing graph exists as a real published asset with matching size, SHA-256 and OSM attribution.")
          PY

      - name: Check source and downloaded content catalog
        working-directory: doom
        run: python3 tool/zero_build_release_gate.py
