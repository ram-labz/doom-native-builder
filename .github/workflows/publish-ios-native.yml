name: Publish reusable slim CoMaps iOS release (no compilation)

on:
  workflow_dispatch:
    inputs:
      repack_run_id:
        description: Successful slim repack workflow run ID, never latest automatically
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: doom-comaps-ios-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Preflight publishing script without downloading native files
        run: |
          python3 -m unittest discover -s tests -p 'test_publish_slim_release.py' -v
          python3 -m py_compile scripts/publish_slim_release.py

      - name: Validate explicitly selected successful slim repack
        id: repack
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REPACK_RUN: ${{ inputs.repack_run_id }}
        run: |
          set -euo pipefail
          RUN_ID="$REQUESTED_REPACK_RUN"
          if [[ ! "$RUN_ID" =~ ^[0-9]{5,15}$ ]]; then
            echo '::error::A specific real slim repack run ID is required.'
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID" \
            --jq 'if .name == "Slim successful CoMaps artifact (no compilation)"
                 and .status == "completed" and .conclusion == "success"
                 and (.event == "workflow_dispatch" or
                      (.event == "push" and .head_sha == "c6d70125e73d6b93ab70435bc3b79664400b2d37"))
                 then {id,status,conclusion,name,head_sha}
                 else error("Selected run is not a successful native repack") end'
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Publishing the exact chosen repack: $RUN_ID"

      - name: Download already compiled slim artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.repack.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/slim"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name doom-ios-native-slim --dir "$RUNNER_TEMP/slim"
          test -s "$RUNNER_TEMP/slim/doom-ios-native-slim.tar.gz"
          test -s "$RUNNER_TEMP/slim/doom-ios-native-slim.tar.gz.sha256"
          cd "$RUNNER_TEMP/slim"
          sha256sum --check doom-ios-native-slim.tar.gz.sha256
          df -h .

      - name: Publish verified split assets as reusable public release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.repack.outputs.run_id }}
        run: |
          python3 scripts/publish_slim_release.py \
            --bundle "$RUNNER_TEMP/slim/doom-ios-native-slim.tar.gz" \
            --sha-file "$RUNNER_TEMP/slim/doom-ios-native-slim.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$RUN_ID"
